name: Lab
# The lab runs a real Home Assistant in real time and takes about ten minutes,
# so it does not run on every push.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "custom_components/**"
      - "engine/**"
      - "lab/**"
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            lab/requirements.txt
            engine/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: sudo systemctl stop mosquitto || true
      - run: pip install -r lab/requirements.txt
      - run: python lab/check_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report
          path: lab/reports/latest.json
